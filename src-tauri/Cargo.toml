[package]
name = "jutex"
version = "2.0.0"
description = "Editor LaTeX local estilo Overleaf"
authors = ["JuTeX contributors"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jutex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6.0.0"
dunce = "1.0.5"
thiserror = "2.0.21"
walkdir = "2.5.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate", "deflate64"] }
trash = "5.2.9"
tauri-plugin-dialog = "2"
notify = "8.2.0"
regex = "1.13.1"
libc = "0.2.190"
ureq = "3.4"
sha2 = "0.10"
ignore = "0.4.33"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already part of Tauri on Linux (same version): reading images from the clipboard.
gtk = "0.18"
# Already part of Tauri on Linux (wry): turning WebKitGTK 2.54's damage tracking off.
webkit2gtk = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Already part of the tree on macOS (Tauri): images pasted from the pasteboard, telling Finder
# that the trash changed and the monospace fonts.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSImageRep", "NSBitmapImageRep", "NSWorkspace"] }
# Already part of the tree on macOS (Tauri, through objc2-app-kit): the monospace fonts with
# Core Text, which (unlike AppKit's font manager) can be asked from any thread.
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFontDescriptor", "CTFontTraits"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFSet", "CFString"] }
# Already part of the tree on macOS (`trash`, Tauri): the trash through NSFileManager and the
# machine's memory.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSArray", "NSEnumerator", "NSFileManager", "NSProcessInfo", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
# Already part of the tree on Windows (Tauri): programs without a console window and runs in
# a Job Object, so cancelling ends everything they started; the clipboard, the fonts and the
# memory.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }
# Already in the tree (Tauri's build): a screenshot comes as a bitmap, saved as PNG.
png = "0.18"
# Already in the tree (Tauri's WebView2): the paths of files dropped from the Explorer.
webview2-com = "0.39"
windows-core = "0.62"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
