[package]
name = "libretex"
version = "1.1.0"
description = "Editor LaTeX local estilo Overleaf"
authors = ["LibreTeX contributors"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "libretex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6.0.0"
thiserror = "2.0.21"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64"] }
trash = "5.2.9"
tauri-plugin-dialog = "2"
notify = "8.2.0"
regex = "1.13.1"
libc = "0.2.190"
ureq = "3.4"
sha2 = "0.10"
ignore = "0.4.33"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already part of Tauri on Linux (same version): reading images from the clipboard.
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# Already part of the tree on macOS (Tauri): images pasted from the pasteboard, telling Finder
# that the trash changed and the monospace fonts.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSImageRep", "NSBitmapImageRep", "NSWorkspace", "NSFont", "NSFontManager"] }
# Already part of the tree on macOS (`trash`, Tauri): the trash through NSFileManager and the
# machine's memory.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSArray", "NSEnumerator", "NSFileManager", "NSProcessInfo", "NSString", "NSURL"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
